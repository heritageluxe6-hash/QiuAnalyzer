name: Build Qiu Analyzer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: |
          unzip -q QiuAnalyzer_Specialized.zip -d extracted

      - name: Build debug APK
        working-directory: extracted/GameScreenAnalyzer_Specialized
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QiuAnalyzer-debug-apk
          path: extracted/GameScreenAnalyzer_Specialized/app/build/outputs/apk/debug/app-debug.apk
